'use strict';

const GUIDE_DATA = {"Project Manager":{"match":"0.1 Project Manager","intro":"Controls browser-stored project records and JSON backup/restore. Export JSON before upgrades and verify report output after import.","evidence":["Project identified","Backup exported before major changes","Imported data verified"],"templates":[{"title":"Backup before upgrade","target":"saveStatus","text":"Project JSON backup exported before calculator upgrade or design logic update. Designer to retain this backup with the project record and verify the report output after reloading the project."},{"title":"Imported previous version","target":"saveStatus","text":"Project data imported from a previous calculator version. Designer to verify all calculated outputs, report sections, photo evidence, registers and Review Required items before issue."}]},"Project Scope Selector":{"match":"0.3 Project Scope Selector","intro":"Include / Exclude controls report visibility and validation scope only. Exclusion must not delete data or create false missing-field errors.","evidence":["Applicable modules selected","Safety-relevant exclusions justified","Data retained when excluded"],"templates":[{"title":"Module not applicable","target":"saveStatus","text":"Module excluded from the generated report because it is not applicable to the current project scope. Existing data, if any, has been retained in the calculator record."},{"title":"Retained for evidence","target":"saveStatus","text":"Module retained in scope because design evidence or review record is required for this project."},{"title":"Report-only exclusion","target":"saveStatus","text":"Module excluded from report output only. Data remains preserved in the project JSON for audit traceability."}]},"Project / Site Details":{"match":"1. Project / Site Details","intro":"Records site metadata, document control and design assurance roles. Approval wording must only be used where actual approval occurred.","evidence":["Site and jurisdiction recorded","Document revision controlled","Designer/checker/approver identified"],"templates":[{"title":"Draft issue","target":"basisNotes","text":"This report has been prepared as a draft design record for internal engineering review. Final issue is subject to completion of outstanding checks, evidence records and independent review."},{"title":"For check","target":"basisNotes","text":"This revision is issued for independent technical check. Review Required items, assumptions and missing evidence shall be closed or accepted before approval."},{"title":"Approval pending","target":"basisNotes","text":"Design approval is pending completion of checker review, closure of Review Required items and confirmation of controlled evidence."}]},"Design Basis / Demand Inputs":{"match":"2. Design Basis / Demand Inputs","intro":"Defines gas type, peak demand, demand unit, growth allowance, diversity and governing design case. Missing demand evidence remains Review Required.","evidence":["Peak demand source recorded","Unit and conversion basis clear","Future growth justified","Governing case identified"],"templates":[{"title":"Meter Qmax basis","target":"diversityBasis","text":"Peak load has been based on the maximum Qmax capacity of the relevant gas meter(s), converted to the selected design demand unit and used as the governing design input for the downstream LPG network assessment."},{"title":"Client / supervisor basis","target":"diversityBasis","text":"Peak load has been based on demand information provided by the client / site supervisor. The source, date and scope of the provided demand information should be retained with the project evidence."},{"title":"Missing demand evidence","target":"basisNotes","text":"Peak demand source is not fully evidenced. The design basis shall remain Review Required until the demand source, unit conversion and governing design case are confirmed."}]},"Bulk Storage / Siting / Delivery":{"match":"4. Bulk Storage / Siting / Delivery","intro":"Records vessel arrangement, group capacity, separation, walls, vegetation, delivery and vehicle-impact interfaces. Missing separation or protection evidence must not pass silently.","evidence":["Vessel capacities recorded","Group capacity row checked","Separation measured/evidenced","Vegetation and vehicle exposure reviewed"],"templates":[{"title":"Grouped vessels","target":"vehicleProtectionNotes","text":"The storage arrangement comprises multiple vessels. The separation basis shall consider both the largest single vessel and the maximum LPG capacity of the group, applying the more onerous controlled design requirement where applicable."},{"title":"Separation Review Required","target":"vehicleProtectionNotes","text":"Storage separation evidence is incomplete or below the calculated requirement. The arrangement shall remain Review Required until separation, wall arrangement or revised layout evidence is confirmed."},{"title":"Fire wall evidence missing","target":"vehicleProtectionNotes","text":"Fire wall / gas dispersion wall is referenced but supporting evidence is incomplete. Wall type, location, height, extent and design basis shall be confirmed before any reduced separation is accepted."},{"title":"Vegetation review","target":"vehicleProtectionNotes","text":"Vegetation, trees, shrubs or screening are present or uncertain near the storage arrangement. Designer shall confirm that ventilation, relief discharge, emergency access, inspection access and vessel valve operation are not obstructed."},{"title":"Vehicle impact protection","target":"vehicleProtectionNotes","text":"Vehicle impact exposure is present or reasonably foreseeable. Suitable engineered protection, relocation or risk assessment shall be recorded before the arrangement is closed."},{"title":"Bollard specification","target":"vehicleProtectionNotes","text":"Bollard vehicle impact protection provided. Cross-section / diameter: [mm] mm (min. 80 mm). Height above finished ground level: [mm] mm (min. 500 mm). Centre-to-centre spacing: [m] m (max. 1.4 m). Offset from vessel profile: [m] m (range 1.0 to 5.0 m). Installation basis and drawing reference to be confirmed. Ref: Manual Table 11A-4."},{"title":"Fire wall specification","target":"vehicleProtectionNotes","text":"Fire wall provided to allow reduced Table 11A-1 separation for above-ground vessel. Construction: masonry, minimum thickness 225 mm, minimum 2 hours fire resistance rating. Height: minimum 2 m or above top of vessel, whichever is greater. Length: minimum equal to vessel length. Offset from vessel: 1.5 to 3.0 m. Drawing reference and construction evidence to be confirmed. Ref: Manual Section 11.10."},{"title":"Gas dispersion wall specification","target":"vehicleProtectionNotes","text":"Gas dispersion wall provided to allow reduced underground / mounded vessel separation. Construction: masonry, minimum thickness 225 mm, minimum 2 hours fire resistance rating. Height: minimum 2 m. Length: minimum equal to vessel length. Offset from vessel: 1.5 to 3.0 m. Drawing reference and construction evidence to be confirmed. Ref: Manual Section 11.10."},{"title":"Wall protection specification","target":"vehicleProtectionNotes","text":"Masonry or concrete wall vehicle impact protection provided. Wall height: [mm] mm above finished ground level (min. 500 mm). Construction type, footing basis and drawing reference to be confirmed. Ref: Manual Table 11A-4."},{"title":"No vehicle impact foreseeable","target":"vehicleProtectionNotes","text":"Vehicle impact has been assessed as not foreseeable for this storage arrangement based on the site layout, access constraints and parking / traffic conditions. No dedicated vehicle-impact protection is required at this location. Parking and no-parking signage shall be provided per Manual Section 11.15."},{"title":"Separation confirmed","target":"vehicleProtectionNotes","text":"Measured separation distances have been confirmed against Table 11A-1 requirements. Siting row applied based on the more onerous of single-vessel water capacity and group LPG capacity. All measured distances meet or exceed the required separation. No fire wall or gas dispersion wall reduction has been applied."}]},"Storage Capacity / Vessel Selection":{"match":"3. Storage Capacity / Vessel Selection","intro":"Checks storage against peak demand, natural vaporisation, usable inventory, nominal inventory, autonomy and candidate arrangements. Storage volume alone is not sufficient.","evidence":["Design peak confirmed","Daily demand basis recorded","Mu/Mn calculable","Vaporiser decision justified"],"templates":[{"title":"Selected arrangement basis","target":"stSelReason","text":"The selected vessel arrangement has been reviewed against design peak demand, available natural vapour off-take, usable inventory and autonomy basis. Designer to verify that the selected arrangement is suitable for the project operating conditions."},{"title":"Insufficient margin","target":"stSelReason","text":"The selected arrangement meets or approaches the design peak demand but does not provide sufficient spare vapourisation margin. Designer shall consider additional capacity, alternative vessel arrangement or vaporiser review."},{"title":"Daily demand missing","target":"stSelReason","text":"Average daily consumption has not been recorded. Required usable inventory Mu and required nominal inventory Mn cannot be fully confirmed. Autonomy assessment remains Review Required."},{"title":"Vaporiser required","target":"stSelReason","text":"Natural vapourisation capacity is insufficient for the recorded peak demand. Vaporiser duty, specification, controls, location, electrical requirements and maintenance basis require specialist review."},{"title":"Arrangement confirmed - margin pass","target":"stSelReason","text":"The selected vessel arrangement provides sufficient natural vapour off-take to meet the design peak demand with the required minimum vapourisation margin. Usable inventory and autonomy are confirmed against the daily demand basis. Candidate analysis reviewed and selection basis recorded."},{"title":"Underground / mounded selection","target":"stSelReason","text":"Underground or mounded vessel arrangement selected. Natural vapour off-take reference values for underground vessels applied from Appendix 11C. Designer shall verify that the selected vessel type, installation method and autonomy are suitable for the site conditions and delivery frequency."},{"title":"Vaporiser specification required","target":"stSelReason","text":"Vaporiser is required to supplement natural vapourisation. Vaporiser duty, type, electrical supply, controls, safety relief and maintenance access require specialist review and specification. Vaporiser contribution shall be confirmed against the design peak demand in the storage selection output."},{"title":"Autonomy review","target":"stSelReason","text":"Autonomy period has been reviewed against the required design basis. Designer shall confirm that the delivery frequency, stock management procedure and reorder trigger level are consistent with the calculated autonomy and the nominal inventory Mn."}]},"AFT Arrow Hydraulic Results":{"match":"5. AFT Arrow Hydraulic Results","intro":"Summarises hydraulic model outputs. Record model reference, pressure units, terminal pressure source, velocity and pressure-drop basis.","evidence":["Model reference recorded","Pipe rows entered","Pressure units consistent","Terminal pressure basis recorded"],"templates":[{"title":"AFT model reference","target":"modelRef","text":"Hydraulic assessment is based on AFT Arrow model reference [insert model / report reference]. Pipe section results have been manually transcribed into the calculator for report summarisation."},{"title":"Terminal pressure review","target":"hydraulicConclusion","text":"Terminal pressure margin is insufficient or not fully evidenced. Regulator / PRI performance basis, downstream pressure requirement and model boundary conditions require review."},{"title":"Model missing","target":"hydraulicConclusion","text":"AFT model reference or hydraulic calculation evidence has not been recorded. Hydraulic conclusion shall remain Review Required until the controlled calculation basis is available."},{"title":"Terminal pressure confirmed","target":"hydraulicConclusion","text":"Terminal pressure margin is positive. Network outlet pressure from AFT Arrow model exceeds the required terminal pressure at the most downstream point. Velocity and pressure drop results have been reviewed. All pipe sections are within acceptable limits per Manual Section 6.5."},{"title":"Velocity warning","target":"hydraulicConclusion","text":"Maximum gas velocity in one or more pipe sections is approaching or exceeding the recommended limit of 20 m/s. Designer shall review the AFT model, consider increasing pipe diameter or revising the design peak demand basis. Ref: Manual Section 6.5 / 13.4.3."},{"title":"LP network basis","target":"hydraulicConclusion","text":"LP distribution network assessed using AFT Arrow. Operating pressure range confirmed as LP (0.1 bar or below). Pipe section results, pressure drops, velocities and terminal pressure margin recorded. Terminal pressure check basis confirmed from regulator OEM data. Ref: Manual Section 6."},{"title":"Multi-branch network","target":"hydraulicConclusion","text":"Network comprises multiple branches and pressure drop paths. Terminal pressure margin has been confirmed for the most unfavourable path to the most remote terminal point. Intermediate pressures and branch velocities have been reviewed and are within acceptable limits."}]},"Distribution Mains Design":{"match":"6. Distribution Mains Design","intro":"Covers multiple mains, route, cover, proximity, pressure class, material, DN/OD, pipe schedule, trees, traffic and special crossings.","evidence":["Classification justified","Route and cover recorded","Building proximity checked","Pipe specification complete"],"templates":[{"title":"Standard PE main","target":"narrMains","text":"Distribution main proposed as PE pipework with recorded route, cover, pressure class, DN/OD band and pipe specification. Designer shall verify material grade, SDR, jointing method and installation basis against the approved design requirements."},{"title":"Trafficked route","target":"narrMains","text":"Main route includes carriageway, parking or trafficked area exposure. Cover depth, mechanical protection, special crossing details and reinstatement requirements shall be reviewed and recorded."},{"title":"Pipe specification missing","target":"narrMains","text":"Pipe specification schedule is incomplete. Material, standard, grade, size, SDR / wall thickness, jointing method and installation method shall be completed before design approval."},{"title":"Steel main","target":"narrMains","text":"Distribution main proposed as steel pipework. Designer shall verify material grade, wall thickness, coating specification, cathodic protection basis, jointing method and installation requirements against the approved design. Cover, proximity and pressure class requirements to be confirmed per Manual Section 13."},{"title":"IP / HP main","target":"narrMains","text":"Intermediate or high-pressure distribution main recorded. IP or HP pressure class applies additional minimum cover requirements (min. 900 mm) and proximity requirements. Designer shall verify cover depth, proximity to buildings and proximity to other services against the Manual requirements. Ref: Manual Section 13."},{"title":"Special crossing","target":"narrMains","text":"Main includes a special crossing (watercourse, railway, highway or other utility conflict). Special crossing design, installation method, inspection and approval requirements shall be reviewed and recorded separately. Relevant consents and approvals to be obtained before construction. Ref: Manual Section 13."},{"title":"Near trees / deep-rooted vegetation","target":"narrMains","text":"Main route is near trees, deep-rooted vegetation or landscape features. Root barrier, increased cover, protective conduit or rerouting may be required. Designer shall confirm the protection basis and record in the mains design notes. Ref: Manual Section 13."},{"title":"Cover depth concern","target":"narrMains","text":"Cover depth on one or more main sections is below the standard requirement or approaching the minimum. Designer shall verify that the reduced cover is justified by route type, protection measures or engineering assessment, and record the basis in the design notes."}]},"Service Line Design":{"match":"7. Service Line Design","intro":"Covers route type, cover, utility crossing, building entry, internal entry, inlet pressure, trees and vehicle/public exposure.","evidence":["Route type recorded","Cover and utility clearance recorded","Building/internal entry assessed","Inlet pressure recorded"],"templates":[{"title":"Standard service route","target":"servicesNotes","text":"Service line route recorded with route type, cover depth, utility clearance and inlet pressure. Designer shall verify route, cover and entry detail against project drawings and site conditions."},{"title":"Building entry review","target":"servicesNotes","text":"Service enters or interfaces with a building / cavity / internal space. Entry arrangement, sealing, route, ventilation and ownership boundary require review."},{"title":"Vehicle exposure","target":"serviceRiskNotes","text":"Service route may be vulnerable to vehicle damage, parking or public access exposure. Protection or route risk assessment should be recorded."},{"title":"Carriageway route","target":"servicesNotes","text":"Service route includes carriageway or trafficked area. Cover depth minimum 750 mm for carriageway. Mechanical protection, warning tape, reinstatement specification and traffic management basis to be recorded. Special crossing details required if crossing under road. Ref: Manual Section 14."},{"title":"Building / cavity wall entry","target":"servicesNotes","text":"Service enters the building or associated cavity wall. Entry arrangement, sealing method, route through structure, ventilation interface and ownership boundary require review. Internal pipework, sleeve sealing and entry protection basis to be confirmed. Ref: Manual Section 14."},{"title":"Tree / root exposure","target":"serviceRiskNotes","text":"Service route is near trees or deep-rooted vegetation. Root intrusion risk is present. Root barrier, increased cover, protective conduit or rerouting shall be considered and the protection basis confirmed. Ref: Manual Section 14."},{"title":"IP service","target":"servicesNotes","text":"Service is operating at intermediate pressure (IP). Pressure class, material, cover depth and proximity requirements for IP service apply. Designer shall verify that all installation requirements for IP service are met and recorded. Ref: Manual Section 14."}]},"PRS":{"match":"8. Pressure Regulating Station","intro":"Records PRS presence, group, continuity, upstream pressure, P&ID, setpoint schedule and Technical Authority review triggers.","evidence":["PRS presence recorded","P&ID status recorded","Setpoint schedule status recorded","Upstream pressure reviewed"],"templates":[{"title":"P&ID missing","target":"prsNotes","text":"PRS P&ID / line diagram has not been provided or is not confirmed. PRS design shall remain Review Required until controlled diagram evidence is available."},{"title":"Setpoint missing","target":"prsNotes","text":"PRS setpoint schedule is missing or not confirmed. Regulator setpoints and pressure-control basis shall be verified before design approval."},{"title":"Upstream >16 bar","target":"prsNotes","text":"PRS upstream pressure greater than 16 bar has been recorded. Technical Authority / specialist review is required before final design acceptance."},{"title":"PRS continuity required","target":"prsNotes","text":"Continuity of supply has been recorded as required for this site. PRS design shall include a duty / standby regulator arrangement or alternative approved continuity provision. Continuity basis to be confirmed and reflected in the PRS P&ID / line diagram."},{"title":"Outdoor PRS - open air","target":"prsNotes","text":"PRS is located in an outdoor, open-air position. Ventilation is by natural open-air dilution. Relief / breather outlets terminate safely to open air. HAC / ATEX implications reviewed in Section 11. P&ID and setpoint schedule to be provided. Ref: Manual Section 12."},{"title":"Enclosed PRS cabinet","target":"prsNotes","text":"PRS is located in an enclosed cabinet or kiosk. Enclosure ventilation, relief / breather routing and HAC / ATEX implications require specialist review. P&ID and setpoint schedule required before approval. Ventilation calculation to be completed. Ref: Manual Sections 12 and 17."},{"title":"P&ID and setpoints confirmed","target":"prsNotes","text":"PRS P&ID / line diagram and setpoint schedule have been provided and reviewed. PRS group, continuity basis, upstream pressure and regulator setpoints are confirmed. Outstanding items to be recorded in the non-compliance / works register where applicable."}]},"PRI":{"match":"9. Pressure Regulating Installation","intro":"Covers PRI pressure type, terminal pressure, enclosure ventilation, direct-to-open-air path, breather/relief route and impact exposure.","evidence":["PRI type recorded","Terminal pressure/OEM basis recorded","Ventilation basis checked","Breather/relief route reviewed"],"templates":[{"title":"MP PRI review","target":"priNotes","text":"MP service with PRI has been recorded. PRI pressure basis, enclosure category, ventilation, breather / relief routing and equipment location require review."},{"title":"Semi-concealed enclosure","target":"priNotes","text":"PRI is located in a semi-concealed, recessed or constrained enclosure. Ventilation category, net free area, dead spaces and discharge path require detailed review."},{"title":"Breather route missing","target":"priProtectionNotes","text":"Breather / relief termination route is not confirmed. PRI arrangement remains Review Required until the discharge route and safe termination are evidenced."},{"title":"LP final regulator - standard","target":"priNotes","text":"LP final regulator (100 mbar or below) arrangement. Enclosure ventilation check is not applicable for this regulator type. Breather / vent termination reviewed. Impact exposure assessed. Terminal pressure and OEM basis confirmed. Ref: Manual Section 9."},{"title":"Open-air PRI","target":"priNotes","text":"PRI is located in an open-air external position. Direct ventilation to open air confirmed. Enclosure ventilation calculation not applicable. Breather / relief termination route reviewed and confirmed safe. HAC / ATEX implications assessed in Section 11. Ref: Manual Sections 9 and 17."},{"title":"Ventilation area confirmed - pass","target":"priNotes","text":"PRI enclosure ventilation has been checked. Provided net free ventilation area exceeds the required minimum for the selected enclosure category. Ventilation openings discharge directly to open air with no intermediate void. No dead spaces or stagnant pockets identified."},{"title":"Ventilation area insufficient","target":"priNotes","text":"Provided net free ventilation area is below the required minimum for the selected enclosure category. Enclosure category, vent count, gross vent area, free-area factor or enclosure dimensions require review. Additional ventilation, enclosure redesign or relocation may be required. Ref: Manual Table 10-1."},{"title":"Non-standard enclosure","target":"priNotes","text":"PRI enclosure is non-standard, higher-risk or cannot be confirmed as a standard external cabinet. Ventilation factor 6 percent applied. Specialist review required to confirm enclosure classification, net free area and discharge route. Ref: Manual Section 10."}]},"Meter and Meter Cabinet Design":{"match":"10. Meter and Meter Cabinet Design","intro":"Covers meter location, MP regulator upstream of meter, gas/electrical separation, vent termination, impact exposure, point of delivery and ownership boundary.","evidence":["Meter location recorded","MP regulator status recorded","Separation evidence recorded","Point of delivery and ownership defined"],"templates":[{"title":"Standard external cabinet","target":"meterNotes","text":"Meter is located in an external cabinet. Designer shall confirm access, ventilation, gas/electrical separation, vent termination basis, point of delivery and ownership boundary."},{"title":"MP regulator upstream","target":"meterNotes","text":"MP regulator upstream of the meter has been recorded. Regulator vent termination, gas/electrical separation, cabinet ventilation and HAC / ATEX implications require review."},{"title":"Separation missing","target":"meterNotes","text":"Gas/electrical separation evidence is incomplete. Distance to electricity meter, distribution board or other electrical equipment shall be recorded and reviewed."},{"title":"Impact exposure","target":"meterImpactProtectionNotes","text":"Meter cabinet is exposed to vehicle movement, public access or impact risk. Protected location, bollards, guard, relocation or risk assessment shall be recorded."},{"title":"Information incomplete","target":"meterNotes","text":"Meter cabinet information is incomplete. Location, separation, venting, protection, point of delivery and ownership boundary remain Review Required until confirmed."},{"title":"Separation confirmed - all distances","target":"meterNotes","text":"Gas/electrical separation distances have been recorded and reviewed. Distance to electricity meter: [mm] mm (min. 150 mm). Distance to distribution board: [mm] mm (min. 400 mm). Meter box to flue: [mm] mm (min. 300 mm). All separation requirements met. Ref: Manual Section 16.13."},{"title":"MP regulator - vent distances confirmed","target":"meterNotes","text":"MP regulator is present upstream of the meter. Vent tap to building opening: [mm] mm (min. 1000 mm). Vent tap to electrical equipment: [mm] mm (min. 1550 mm). HAC / ATEX implications reviewed in Section 11. Ref: Manual Section 16.13."},{"title":"DB separation - partition provided","target":"meterNotes","text":"Distance between gas meter and electrical distribution board is below 400 mm. An approved non-conductive partition has been provided. Partition specification and engineering approval basis to be recorded. REVIEW REQUIRED until approval is confirmed. Ref: Manual Section 16.13 / paragraph 2655."},{"title":"Point of delivery and ownership defined","target":"meterNotes","text":"Point of delivery has been defined and recorded. Ownership boundary between Calor-owned and customer-owned assets is confirmed. Meter location, access, labelling and handover basis are recorded. Ref: Manual Section 16."},{"title":"Recessed / concealed meter","target":"meterNotes","text":"Meter cabinet is recessed or located in a constrained or semi-concealed position. Ventilation, pipe entry sealing, cavity gas migration prevention and electrical separation require review. HAC / ATEX implications assessed in Section 11. Ref: Manual Sections 16 and 17."},{"title":"No MP regulator - standard LP meter","target":"meterNotes","text":"No MP regulator upstream of the meter. Standard LP meter cabinet arrangement. Gas/electrical separation distances recorded and reviewed. No vent tap separation assessment required. Point of delivery and ownership boundary confirmed. Ref: Manual Section 16."}]},"HAC / ATEX Screening Record":{"match":"11. HAC / ATEX Screening","intro":"Existing HAC / ATEX guidance is preserved. Additional templates support consistency with PRI and Meter sections.","evidence":["Controlled HAC reference recorded","Zone/review status recorded","Missing evidence recorded"],"templates":[{"title":"Meter / PRI interface","target":"hacNotes","text":"HAC / ATEX review is linked to PRI / meter cabinet arrangement. Designer shall ensure regulator venting, enclosure ventilation, electrical equipment location and zone outcome are consistent across PRI, Meter and HAC sections."},{"title":"Controlled evidence pending","target":"hacMissingEvidence","text":"Controlled HAC evidence is pending. The arrangement shall remain Review Required until the HAC report, drawing, ventilation calculation or Technical Authority note is recorded."},{"title":"PRI ventilation - HAC consistent","target":"hacNotes","text":"PRI enclosure ventilation and HAC / ATEX review are linked. Enclosure category, net free ventilation area and vent / breather routing have been reviewed and are consistent with the PRI section. No additional HAC / ATEX action identified from the PRI arrangement."},{"title":"Meter separation - HAC reviewed","target":"hacNotes","text":"Gas/electrical separation at the meter has been reviewed for HAC / ATEX implications. Separation distances confirmed. No classified zone conflicts with electrical equipment have been identified at the meter location. Ref: Manual Sections 16.13 and 17."},{"title":"Outdoor open-air - standard vessel","target":"hacNotes","text":"Outdoor open-air standard LPG vessel arrangement. No non-standard enclosure, restricted ventilation or mixed gas-electrical condition identified. Standard ignition-source controls and signage requirements remain applicable. Zone outcome to be confirmed against controlled HAC basis."}]},"Narrative Report Text":{"match":"16. Narrative Report Text","intro":"Narrative is editable designer wording for report output. Lock narrative where manual wording must be preserved. Avoid unverified compliance claims.","evidence":["Narrative lock checked","Review Required items reflected","Unverified compliance claims avoided"],"templates":[{"title":"Project overview","target":"narrProject","text":"The project comprises an LPG distribution network design assessment for the recorded site. This report summarises the design basis, storage arrangement, hydraulic assessment, distribution mains, services, pressure control, metering, risk items and outstanding evidence."},{"title":"Review Required summary","target":"narrRisk","text":"The report contains Review Required items. These shall be closed, justified or accepted by competent review before the design is treated as ready for approval."},{"title":"Missing evidence summary","target":"narrRisk","text":"Some evidence required for final design close-out remains outstanding. Missing evidence is identified in the completeness check, compliance summary and relevant section notes."}]},"Auto MTO Output":{"match":"17. Auto MTO Output","intro":"Auto MTO is generated from calculator inputs and is indicative until checked against final drawings, specifications and construction scope.","evidence":["Auto MTO reviewed","Manual MTO updated","Quantities/specifications checked"],"templates":[{"title":"Auto MTO limitation","target":"narrRisk","text":"Auto MTO output is generated from calculator inputs and is indicative only. Designer shall verify quantities, sizes, specifications and construction scope against final drawings."},{"title":"Manual review required","target":"narrRisk","text":"Manual review of Auto MTO is required to confirm omitted items, project-specific materials, fittings, protection measures and construction-stage requirements."}]},"Design Declarations":{"match":"17. Auto MTO Output","intro":"Design declarations are report close-out wording. The calculator supports design evidence but does not auto-approve design.","evidence":["Roles identified","Review Required items resolved or accepted","Document control status correct"],"templates":[{"title":"Not for construction","target":"narrRisk","text":"Not for construction until checked, approved and issued under the applicable project document control process."},{"title":"Subject to outstanding items","target":"narrRisk","text":"This report remains subject to outstanding Review Required items and shall not be treated as final approval until those items are closed or formally accepted."}]}};

const Guide={
 esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));},
 bySummary(match){return Array.from(document.querySelectorAll('details.section')).find(d=>((d.querySelector('summary')||{}).textContent||'').includes(match));},
 insert(target,text){const el=$(target);if(!el){const s=$('saveStatus');if(s)s.textContent='Template target not available in current scope: '+target;console.warn('Guide template target not found',target);return false;}if('value' in el){const cur=String(el.value||'').trim();el.value=cur?cur+'\n\n'+text:text;}else{const cur=String(el.textContent||'').trim();el.textContent=cur?cur+'\n\n'+text:text;}App.refresh(false);return true;},
 makePanel(name,cfg){const items=(cfg.evidence||[]).map(x=>'<li>'+this.esc(x)+'</li>').join('');const btns=(cfg.templates||[]).map((x,i)=>'<button type="button" class="guideBtn" data-guide-key="'+this.esc(name)+'" data-template-index="'+i+'" data-guide-name="'+this.esc(name)+'" data-guide-index="'+i+'">Insert '+this.esc(x.title)+'</button>').join('');return '<div class="guidanceBox" data-guide-panel="'+this.esc(name)+'"><h4>Guidance / templates — '+this.esc(name)+'</h4><div>'+this.esc(cfg.intro||'')+'</div><div class="warn"><b>Controlled-use warning:</b> Guidance supports evidence capture only. It does not create automatic compliance conclusions. Missing or uncertain safety-critical evidence remains REVIEW REQUIRED.</div><details><summary>Minimum evidence checklist</summary><ul>'+items+'</ul></details><details><summary>Quick-fill editable templates</summary><div class="gbuttons">'+btns+'</div><small>Templates append editable wording into the target field.</small></details></div>';},
 addPanels(){Object.entries(GUIDE_DATA).forEach(([name,cfg])=>{const d=this.bySummary(cfg.match);if(!d)return;const b=d.querySelector('.body');if(!b||b.querySelector('[data-guide-panel="'+name+'"]'))return;b.insertAdjacentHTML('afterbegin',this.makePanel(name,cfg));});},
 addReg(key,idx){const row=(GUIDE_REGISTER_TEMPLATES[key]||[])[idx];if(!row||!Registers.data[key])return;Registers.data[key].push(row.slice());Registers.render(key);App.refresh(false);},
  addRegisterPanels(){
    const map={findings:'12. Confirmed',works:'13. Works',mto:'14. Manual',risk:'15. Design Stage'};
    Object.entries(map).forEach(([key,match])=>{
      const d=this.bySummary(match);
      if(!d)return;
      const b=d.querySelector('.body');
      if(!b||b.querySelector('[data-guide-register="'+key+'"]'))return;
      const rows=GUIDE_REGISTER_TEMPLATES[key]||[];
      const btns=rows.map((r,i)=>{
        let label = 'Template ' + (i+1);
        if (key === 'findings') {
          label = r[1] ? (r[1] + (r[3] ? ' (' + r[3] + ')' : '')) : label;
        } else if (key === 'works') {
          label = r[2] ? (r[2] + (r[1] ? ' (' + r[1] + ')' : '')) : label;
        } else if (key === 'mto') {
          label = r[4] ? (r[4] + (r[1] ? ' (x' + r[1] + ')' : '')) : label;
        } else if (key === 'risk') {
          label = r[1] ? (r[1].length > 30 ? r[1].substring(0, 30) + '...' : r[1]) : label;
        }
        return '<button type="button" class="regGuideBtn" data-reg-key="'+key+'" data-reg-index="'+i+'" title="'+this.esc(r[2]||r[3]||r[4]||r[1]||'')+'">Add '+this.esc(label)+'</button>';
      }).join('');
      b.insertAdjacentHTML('afterbegin','<div class="guidanceBox" data-guide-register="'+key+'"><h4>Register guidance / templates</h4><div>Use these rows as editable starting points only. Confirm location, evidence, action owner and status before issue.</div><div class="gbuttons">'+btns+'</div></div>');
    });
  },
 addFieldHints(){const hints={
peakDemand:'Enter the governing network peak demand for this project. Record the diversity basis, measurement source or calculation method in the Diversity / Demand Basis field. Empty or zero → REVIEW REQUIRED in compliance report. Ref: Manual Section 2.',
demandUnit:'Select the unit matching the source data. Conversion to kW and kg/h is automatic. Keep units consistent between Design Basis and Storage Capacity sections.',
futureGrowth:'Enter the project-approved growth allowance as a percentage. Typical range: 0–25 %. Use 0 only if explicitly agreed with the client and recorded in the design basis. Applied to peak demand before storage and hydraulic checks.',
vesselNominalCapacityKg:'Nominal LPG capacity of one vessel in kg. Used to calculate group LPG capacity (te) and select the Table 11A-1 siting row. Must match the vessel selection in Storage Capacity section. Ref: Manual Section 11.',
vesselWaterCapacityL:'Water capacity (geometric volume) of one vessel in litres. Used to select Table 11A-1 siting row alongside LPG group capacity. Most-onerous row of single-vessel or group capacity applies. Ref: Manual Table 11A-1.',
vesselCount:'Number of vessels in the group. Affects group LPG capacity (te) and Table 11A-1 row selection. Group row may be more onerous than single-vessel row — calculator applies the worse result automatically. Ref: Manual Section 11.',
distToBuilding:'Measured distance from vessel(s) to nearest building in metres. Compare against AUTO: Required Separation field. If below required separation without fire wall → FAIL. Ref: Manual Table 11A-1.',
distToBoundary:'Measured distance from vessel(s) to nearest property boundary or shared boundary in metres. Compare against AUTO: Required Separation. If below required separation → FAIL. Ref: Manual Table 11A-1.',
distToIgnition:'Measured distance from vessel(s) to nearest fixed ignition source (flue, boiler room, electrical panel) in metres. Compare against AUTO: Required Separation. If below required separation → FAIL. Ref: Manual Table 11A-1.',
distToTrees:'Measured distance from vessel(s) to nearest trees or screening vegetation in metres. Min. 3 m for vessels ≤ 5000 L water capacity; min. 6 m for vessels > 5000 L. Below minimum → FAIL. Ref: Manual Table 11A-3.',
fireWallProvided:'Fire wall allows reduced Table 11A-1 separation for above-ground vessels. If Yes: record wall specification in Vehicle protection / notes — min. 2 hours fire resistance, masonry ≥ 225 mm, height ≥ 2 m (or ≥ tank top), length ≥ vessel length, offset 1.5–3.0 m from vessel. Notes empty or vague → REVIEW REQUIRED. Ref: Manual Section 11.10.',
gasDispersionWallProvided:'Gas dispersion wall allows reduced Table 11A-1 separation for underground / mounded vessels. If Yes: record wall specification in notes — same evidence requirements as fire wall (masonry ≥ 225 mm, 2 hr FR, height ≥ 2 m, offset 1.5–3.0 m). Notes empty or vague → REVIEW REQUIRED. Ref: Manual Section 11.10.',
vehicleImpactForeseeable:'Assess whether a vehicle could impact the vessel or its immediate pipework. If Yes: physical protection (bollards, wall, barrier) is mandatory → select type and complete dimensions. Yes + no protection confirmed → FAIL. Review Required → REVIEW REQUIRED. Ref: Manual Section 11.9.',
vehicularProtectionType:'Select the type of vehicle impact protection provided. Bollards: min 80 mm cross-section, 500 mm height, spacing ≤ 1.4 m, offset 1–5 m from vessel. Wall: min 500 mm height. Incomplete dimensions → FAIL. Ref: Manual Table 11A-4.',
bollardDiameterMm:'Bollard cross-section or diameter in mm. Min. 80 mm required. Below 80 mm → FAIL. Ref: Manual Table 11A-4.',
bollardHeightMm:'Bollard height above finished ground level in mm. Min. 500 mm required. Below 500 mm → FAIL. Ref: Manual Table 11A-4.',
bollardSpacingM:'Centre-to-centre spacing between bollards in metres. Max. 1.4 m allowed. Above 1.4 m → FAIL. Ref: Manual Table 11A-4.',
bollardOffsetM:'Distance from bollard face to nearest vessel profile in metres. Required range: 1.0–5.0 m. Outside range → FAIL. Ref: Manual Table 11A-4.',
wallProtectionHeightMm:'Height of wall protection above finished ground level in mm. Min. 500 mm required. Below 500 mm → FAIL. Ref: Manual Table 11A-4.',
vehicleProtectionNotes:'Record protection design basis, specification reference or risk assessment. Required (meaningful text) where: (a) vehicle impact is foreseeable, or (b) fire wall / gas dispersion wall is used to reduce siting separation distances. Empty or vague text → REVIEW REQUIRED. Ref: Manual Sections 11.9 and 11.10.',
stDaily:'Average daily LPG consumption in the selected unit. Used to calculate required usable inventory Mu and nominal inventory Mn. Empty → autonomy check remains REVIEW REQUIRED in compliance report.',
stAutonomyDays:'Required autonomy period in days — minimum number of days the stored inventory must last at average daily consumption. Typical range: 14–42 days depending on delivery frequency and risk basis. Default 42 days. Adjust to project-approved delivery schedule. Ref: Manual Appendix 11B.',
stFill:'Normal fill fraction as a percentage — the level to which the vessel is filled on delivery. Typical value: 85–87 %. Used to calculate usable inventory (Mu = Mn × (fill − heel) / 100). Default 87 %. Ref: Manual Appendix 11B.',
stHeel:'Minimum stock / reorder heel as a percentage — the minimum level before the vessel is considered empty for autonomy purposes. Typical value: 20–25 %. Default 25 %. Ref: Manual Appendix 11B.',
stMinMargin:'Minimum acceptable vapourisation margin as a percentage above peak demand. Default 10 %. Reduces risk of marginal pass due to ambient variation. Confirm with project design basis. Ref: Manual Appendix 11C.',
modelRef:'Reference number or title of the controlled AFT Arrow model, pipe network calculation or hydraulic analysis. Must identify a specific document. Empty or generic text → REVIEW REQUIRED. Ref: Manual Section 6.',
terminalPressureRequired:'Minimum pressure required at the most downstream terminal point (regulator inlet, PRI, appliance) in mbar. Used to calculate terminal pressure margin = network outlet pressure minus this value. Negative margin → FAIL. Empty → REVIEW REQUIRED. Ref: Manual Section 6 / regulator OEM data.',
enclosureType:'Enclosure category determines required ventilation area factor: Open-air → 1 % of floor area; One-side ventilated → 3 %; Semi-concealed → 6 %; Higher-risk → 6 %. Select the most onerous applicable category. Ref: Manual Table 10-1.',
encWidth:'Internal width of PRI enclosure in metres. Used to calculate required ventilation area: Req. vent = width × depth × factor × 10,000 cm². Must be measured internally. Ref: Manual Table 10-1.',
encDepth:'Internal depth of PRI enclosure in metres. Used with width to calculate required ventilation area. Ref: Manual Table 10-1.',
ventCount:'Number of ventilation openings in the enclosure. Multiplied by gross area and free-area factor to give provided ventilation. Provided must meet or exceed required → FAIL if below. Ref: Manual Table 10-1.',
grossVentArea:'Gross (overall) area of each ventilation opening in cm². Actual free area = gross area × free-area factor / 100. Confirm with manufacturer data sheet.',
freeAreaFactor:'Percentage of the gross vent opening area that is actually open (not blocked by louvre blades, mesh or frame). Typical louvred vent: 50–70 %. Check manufacturer data sheet. Overstating free-area factor will cause a false PASS.',
priUpstreamPressure:'Pressure supplied to the PRI / regulator inlet in mbar. Used to calculate PRI pressure margin = upstream minus terminal required. Confirm with network hydraulic model or service pressure record.',
priTerminalPressure:'Minimum pressure required at the PRI / regulator outlet (appliance inlet) in mbar. Used to calculate PRI pressure margin. Negative margin → FAIL. Confirm from appliance OEM data sheet or network terminal requirement.',
priBreatherRouteReviewed:'Confirm the vent / breather termination route has been reviewed. Outlet must terminate safely outdoors, clear of ignition sources and building openings. No or Review Required → REVIEW REQUIRED in compliance report. Ref: Manual Section 9 / 10.',
directOpenAir:'Yes = enclosure vents directly to open air with no intermediate void or cavity. If No: treat as semi-concealed or higher-risk category. Affects ventilation calculation result. Ref: Manual Table 10-1.',
priLowLevelVent:'LPG vapour is heavier than air — low-level ventilation or a drainage path is required to prevent accumulation at floor level. N/A only if the enclosure has no floor (e.g. fully open base). No → REVIEW REQUIRED. Ref: Manual Section 10.',
hacFurtherAssessment:'Key decision point — triggers all subsequent HAC / ATEX validation rules. Yes or Review Required → controlled reference, outcome, ventilation basis and mitigation fields become required (meaningful text, ≥ 12 characters, not vague). No → standard arrangement; designer notes still required. Ref: Manual Section 17.',
hacControlledRef:'Reference to the controlled HAC document, drawing, ventilation calculation or TA review note. Must be a specific document reference (≥ 12 characters, not a generic phrase like "ok" or "n/a"). Vague or short text → REVIEW REQUIRED. Empty when triggered → REVIEW REQUIRED. Ref: HAC-ATEX-02.',
hacOutcome:'Record the outcome of the hazardous area review — asset type, outdoor/enclosed condition, zone status or Review Required basis. Must be meaningful (≥ 12 characters, not a vague word). Empty or vague → REVIEW REQUIRED. Ref: HAC-ATEX-03.',
hacVentIgnitionReq:'Required when arrangement is non-standard, enclosed, MP, PRI-associated or mixed gas-electrical. Record enclosure category, required/provided free area, vent path and ignition-source controls. Must be meaningful (≥ 12 chars, not "ok" / "n/a"). Vague or empty when triggered → REVIEW REQUIRED. Ref: HAC-ATEX-04.',
hacMitigation:'Record the mitigation, restriction, relocation or design change from the HAC review. If no action required — state this with evidence (e.g. "open-air, no enclosure, standard ignition controls apply"). Must be meaningful (≥ 12 chars, not "ok"). Vague or empty when triggered → REVIEW REQUIRED. Ref: HAC-ATEX-05.',
hacNotes:'Designer notes on evidence reviewed, assumptions, limitations and required follow-up. Must be meaningful (≥ 12 chars, not "checked" or "ok"). Empty or vague → REVIEW REQUIRED regardless of trigger status. Ref: HAC-ATEX-07.',
sepElecMeter:'Min. 150 mm required between gas meter and electricity meter within the same enclosure (min. 300 mm for adjacent wall-mounted boxes). Below 150 mm → FAIL. Empty → REVIEW REQUIRED. Ref: Manual Section 16.13 / §2654.',
sepDB:'Min. 400 mm required between gas meter / meter box and electrical distribution board (DB), unless an approved non-conductive partition is provided. Below 400 mm without partition → FAIL. Below 400 mm with partition → REVIEW REQUIRED (engineering review required). Empty → REVIEW REQUIRED. Ref: Manual Section 16.13 / §2655.',

const STORAGE_KEY='calor_lpg_design_projects_v29';
const STORAGE_KEY_V28='calor_lpg_design_projects_v28';
function migrateV28toV29(){
  try{
    const old=JSON.parse(localStorage.getItem(STORAGE_KEY_V28)||'{}');
    const curr=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    const oldKeys=Object.keys(old);
    if(!oldKeys.length||Object.keys(curr).length)return 0;
    const defs={
      serviceSleeved:'No',serviceSealed:'No',
      servicePipeMaterial:'PE',serviceInstallType:'Underground',
      prsActiveSetpointBar:'',prsMonitorSetpointBar:'',prsOpsoSetpointBar:'',
      priActiveSetpointBar:'',priMonitorSetpointBar:'',priOpsoSetpointBar:'',
      dqpCompleted:'Review Required',ddrApproved:'N/A',
      handoverChecklistCompleted:'Review Required'
    };
    const migrated={};
    oldKeys.forEach(id=>{
      const p=old[id];
      if(!p||typeof p!=='object')return;
      const np=Object.assign({},p);
      Object.keys(defs).forEach(k=>{if(np[k]===undefined)np[k]=defs[k];});
      migrated[id]=np;
    });
    localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));
    console.log('[Calor] Migrated '+oldKeys.length+' project(s) from v28 to v29');
    return oldKeys.length;
  }catch(e){console.error('[Calor] Migration v28→v29 error:',e);return 0;}
}

function updatePrsSetpointHints() {
  const calcStage = (regId, acId, sgId, agId, hintId) => {
    const regVal = n(regId);
    const acVal = n(acId);
    const sgVal = n(sgId);
    const agVal = n(agId);
    const hintEl = $(hintId);
    if (!hintEl) return;
    if (regVal <= 0) {
      hintEl.textContent = '-';
      return;
    }
    
    // 1. Calculate MIP limit based on EN 12279 Table 1
    let mip = 0;
    if (regVal <= 100) {
      mip = Math.min(150, 2.50 * regVal);
    } else if (regVal <= 2000) {
      mip = 1.75 * regVal;
    } else if (regVal <= 5000) {
      mip = 1.40 * regVal;
    } else {
      mip = 1.30 * regVal;
    }
    
    // 2. OPSO Max = MIP / (1 + AG/100)
    const opsoMax = mip / (1 + agVal / 100);
    
    // 3. OPSO Min = max( 1.10 * OP,  OP * (1 + (AC + SG)/100) / (1 - AG/100) )
    const pLockup = regVal * (1 + (acVal + sgVal) / 100);
    let opsoMinFromReg = 0;
    if (agVal < 100) {
      opsoMinFromReg = pLockup / (1 - agVal / 100);
    } else {
      opsoMinFromReg = pLockup / 0.90;
    }
    const opsoMin = Math.max(1.10 * regVal, opsoMinFromReg);
    
    if (opsoMin < opsoMax) {
      hintEl.textContent = Math.round(opsoMin) + ' - ' + Math.round(opsoMax);
    } else {
      hintEl.textContent = 'Min (' + Math.round(opsoMin) + ') exceeds Max (' + Math.round(opsoMax) + ') - Check AC/SG/AG!';
    }
  };

  calcStage('prsA_1stReg', 'prs_1stRegAC', 'prs_1stRegSG', 'prs_1stOpsoAG', 'prsA_1stOpso_hint');
  calcStage('prsA_2ndReg', 'prs_2ndRegAC', 'prs_2ndRegSG', 'prs_2ndOpsoAG', 'prsA_2ndOpso_hint');
  calcStage('prsB_1stReg', 'prs_1stRegAC', 'prs_1stRegSG', 'prs_1stOpsoAG', 'prsB_1stOpso_hint');
  calcStage('prsB_2ndReg', 'prs_2ndRegAC', 'prs_2ndRegSG', 'prs_2ndOpsoAG', 'prsB_2ndOpso_hint');
}

          <button type="button" class="ghost" onclick="DiversityCalc.resetMixed()">${T("Reset")}</button>
          <button type="button" class="ghost" onclick="DiversityCalc.runCurveTests()">${T("Run IGEM tests")}</button>
        </div>
        <div id="divOutMixed" class="out" style="display:none;margin-top:12px;font-size:12px;line-height:1.5;background:#fff;border:1px solid #e2e8f0;border-left:4px solid var(--blue);padding:12px;border-radius:6px;color:#1e293b;"></div>

      <summary style="background:#5b7083;color:white;font-size:11.5px;padding:6px 10px;cursor:pointer;font-weight:bold;list-style:none;">${T("IGEM Guidance & Notation Quick Reference")}</summary>
      <div class="body" style="font-size:11px;color:#475569;line-height:1.5;padding:10px;background:#f8fafc;">
        <p style="margin:4px 0;">${T("<b>IGEM/GL/1 Appendix 5 curves:</b> Pn = a + b * n^-0.5 (sm³/h per consumer). a and b depend on cohort type and average annual usage A (kWh/year). If propane volume is provided, A is calculated as: A = sm³/yr × CV × 0.27778.")}</p>
        <p style="margin:4px 0;">${T("<b>Mixed Cohorts combining rule (A5.1.6):</b> d_mix = (sum(n_i * a_i) + sqrt(sum(n_i * b_i^2))) / sum(n_i). Total Qt = d_mix * sum(n_i).")}</p>
        <p style="margin:4px 0;">${T("<b>Power conversion:</b> kW = sm³/h × CV × 0.27778.")}</p>
        <p style="margin:4px 0;">${T("<b>Limits:</b> For groups n < 10, apply engineering caution due to high instantaneous coincidence of boilers.")}</p>
      </div>
    </div>
    ${photoUploader('Design Basis / Demand Inputs')}
  `;
}

function guideVesselSizingHtml(){return `<details class='section' id='guideVesselSizing'><summary>&#128210; Engineering Guide — Vessel &amp; Load Sizing (IGEM/GL/1 · Appendix 11C)</summary><div class='body'><div class='hint'><b>Reference only.</b> This guide documents the calculation methodology embedded in the calculator. It does not replace the Calor Design Manual or IGEM/GL/1 Edition 3.</div><h3 class='guide-h3'>1. Diversity / Load Sizing — IGEM/GL/1 Ed.3 Appendix 5</h3><p style='font-size:13px;margin:4px 0 10px'>Continuous coincidence curves replace legacy stepped-percentage tables (TC2 2013), producing accurate Q<sub>peak</sub> for networks of any size.</p><h4 class='guide-h4'>1.1 Cohort Types</h4><table class='guide-table'><tr><th>Code</th><th>Housing Type</th><th>Notes</th><th>Max n</th></tr><tr><td><code>pre1977_wet</code></td><td>Wet CH — pre-1977</td><td>Old stock, high heat loss, temp-sensitive peak</td><td>250</td></tr><tr><td><code>post1976_wet</code></td><td>Wet CH — post-1976</td><td>Standard insulated CH housing</td><td>180</td></tr><tr><td><code>older_noch</code></td><td>No CH — older</td><td>Cooking + DHW only, no heating</td><td>200</td></tr><tr><td><code>new_noch</code></td><td>No CH — new</td><td>Energy-efficient, low base load</td><td>200</td></tr><tr><td><code>post1990_ch</code></td><td>Post-1990 CH</td><td>Well-insulated, low specific heat</td><td>200</td></tr></table><h4 class='guide-h4'>1.2 Single Cohort Formula</h4><div class='formula'>P<sub>n</sub> = a + b / &#8730;n &nbsp;&nbsp; [sm&#179;/h per consumer]<br>Q<sub>t</sub> = P<sub>n</sub> &times; n &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; [total cohort flow, sm&#179;/h]<br>P<sub>kW</sub> = Q<sub>t</sub> &times; cv &times; 0.27778 &nbsp; [cv = 39 MJ/sm&#179; propane vapour]</div><p style='font-size:12px;margin:6px 0 4px'><b>Parameters a and b &nbsp;(A = annual energy per consumer, kWh/year):</b></p><table class='guide-table'><tr><th>Cohort</th><th>a</th><th>b</th></tr><tr><td>pre1977_wet</td><td>0.000966 &times; 0.0353 &times; A</td><td>0.000966 &times; 0.139 &times; A</td></tr><tr><td>post1976_wet</td><td>0.02832 &times; (5.69 + 0.00109 &times; A)</td><td>0.02832 &times; (19.25 + 0.00369 &times; A)</td></tr><tr><td>older_noch</td><td>0.000966 &times; 0.0397 &times; A</td><td>0.000966 &times; 0.161 &times; A</td></tr><tr><td>new_noch</td><td>0.000966 &times; 0.0505 &times; A</td><td>0.000966 &times; 0.18 &times; A</td></tr><tr><td>post1990_ch</td><td>0.0253 &times; (&#8722;2.5526 + 0.0014 &times; A)</td><td>0.0253 &times; (10.6378 + 0.0053 &times; A)</td></tr></table><div class='guide-note'><b>Volume input:</b> Propane sm&#179;/year auto-converted: A = V &times; 93 &times; 0.27778. Coefficients 0.02832 and 0.000966 convert from imperial (ft&#179;/therms) to metric.</div><h4 class='guide-h4'>1.3 Mixed Cohorts — Combining Rule (A5.1.6)</h4><div class='formula'>d<sub>mix</sub> = [ &Sigma;(n<sub>i</sub> &times; a<sub>i</sub>) + &#8730;&Sigma;(n<sub>i</sub> &times; b<sub>i</sub>&#178;) ] / N<br>Q<sub>t</sub> = d<sub>mix</sub> &times; N &nbsp;&nbsp; (N = &Sigma;n<sub>i</sub>, total consumers all cohorts)</div><h3 class='guide-h3'>2. Vessel Selection &amp; Storage Sizing</h3><h4 class='guide-h4'>2.1 Check 1 — Autonomy</h4><div class='formula'>m<sub>day</sub> = P<sub>kW</sub> &times; h<sub>fl</sub> / 13.9 &nbsp;&nbsp; [kg/day via full-load hours; or enter directly]<br>M<sub>u</sub> = m<sub>day</sub> &times; N<sub>d</sub> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; [required usable inventory, kg; default N<sub>d</sub> = 42 days]<br>M<sub>n</sub> = M<sub>u</sub> / (f<sub>fill</sub> &#8722; f<sub>heel</sub>) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; [nominal; default 0.87 &#8722; 0.25 = 0.62]<br>Autonomy = Usable / m<sub>day</sub> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; [days; PASS if Autonomy &#8805; N<sub>d</sub>]</div><h4 class='guide-h4'>2.2 Check 2 — Vapourisation Capacity (Appendix 11C, +5&deg;C, 25% fill)</h4><table class='guide-table'><tr><th>Type</th><th>Vessel kg</th><th>kg/h</th><th>kW</th></tr><tr><td>Above-ground</td><td>230</td><td>4.2</td><td>60</td></tr><tr><td>Above-ground</td><td>600</td><td>10.52</td><td>145</td></tr><tr><td>Above-ground</td><td>1000</td><td>13.2</td><td>187</td></tr><tr><td>Above-ground</td><td>2000</td><td>19.0</td><td>264</td></tr><tr><td>Above-ground</td><td>3000</td><td>25.0</td><td>347</td></tr><tr><td>Above-ground</td><td>4000</td><td>36.9</td><td>513</td></tr><tr><td>Underground</td><td>1000</td><td>6.8</td><td>94</td></tr><tr><td>Underground</td><td>2000</td><td>9.5</td><td>132</td></tr><tr><td>Underground</td><td>6500</td><td>26.4</td><td>366</td></tr></table><div class='formula'>Q<sub>design</sub> = Q<sub>peak</sub> &times; (1 + FutureGrowth% / 100)<br>Margin% = (Available<sub>total</sub> &#8722; Q<sub>design</sub>) / Q<sub>design</sub> &times; 100%</div><div class='guide-note'><b>PASS:</b> Margin% &#8805; minMargin (default 10%) &nbsp;&middot;&nbsp; <b>REVIEW REQUIRED:</b> 0 &#8804; Margin% &lt; 10% &nbsp;&middot;&nbsp; <b>FAIL:</b> Available &lt; Q<sub>design</sub></div><div class='guide-tip'><b>Vaporiser trigger:</b> If Available &lt; Q<sub>design</sub> but stVaporiser = Yes &#8594; FAIL &#8594; REVIEW REQUIRED. Required duty: P<sub>vap</sub> = Q<sub>design</sub> &#8722; Available<sub>total</sub> (kW). Separate vaporiser design required.</div><h4 class='guide-h4'>2.3 Check 3 — Above-ground Group Limits</h4><table class='guide-table'><tr><th>Vessel size (kg)</th><th>Max in group</th><th>Notes</th></tr><tr><td>230, 1000, 4000</td><td>3</td><td>Fire separation required beyond limit</td></tr><tr><td>3000</td><td>4</td><td></td></tr><tr><td>600</td><td>5</td><td></td></tr><tr><td>2000</td><td>6</td><td></td></tr><tr><td>Underground / Mounded</td><td>No direct limit</td><td>Group siting table row applies</td></tr></table><h4 class='guide-h4'>2.4 Selection Flow</h4><div class='guide-flow'><div class='guide-flow-box'><b>Inputs:</b> Q<sub>peak</sub> (kW) &middot; Annual A (kWh/yr) &middot; Vessel type, size &amp; count (designer selection)</div><div class='guide-flow-arrow'>&#8595;</div><div class='guide-flow-row'><div class='guide-flow-box' style='flex:1'>Check 1<br><b>Autonomy</b><br>Usable &#8805; M<sub>u</sub>?</div><div class='guide-flow-box' style='flex:1'>Check 2<br><b>Vapourisation</b><br>Available &#8805; Q<sub>design</sub>?</div><div class='guide-flow-box' style='flex:1'>Check 3<br><b>Group Limit</b><br>Count &#8804; max?</div></div><div class='guide-flow-arrow'>&#8595;</div><div class='guide-flow-row'><div class='guide-flow-box guide-flow-pass' style='flex:1'>All pass &#8594; <b>PASS</b></div><div class='guide-flow-box guide-flow-review' style='flex:1'>Any REVIEW &#8594; <b>REVIEW REQUIRED</b></div><div class='guide-flow-box guide-flow-fail' style='flex:1'>Any FAIL &#8594; <b>FAIL</b></div></div></div><h3 class='guide-h3'>3. Skills Matrix Alignment</h3><table class='guide-table'><tr><th>Requirement</th><th>Implementation</th></tr><tr><td><b>Safety-Critical</b></td><td>Missing daily demand or undefined ambient &#8594; REVIEW REQUIRED (never silent PASS). Vaporiser-assisted &#8594; REVIEW REQUIRED pending separate design.</td></tr><tr><td><b>Design Control</b></td><td>Workflow status For Check / Checked / Approved enforced via 0.4 Role Control. Checker and Approver mandatory before Approved.</td></tr><tr><td><b>Traceability</b></td><td>diversityBasis field stores full IGEM/GL/1 calculation trace with timestamp for audit.</td></tr></table><div class='guide-note'><b>Standards:</b> IGEM/GL/1 Ed.3 Appendix 5 &middot; Calor Installation Manual 25627 &middot; Design Manual Appendix 11C &middot; EN 12186:2014 &middot; I.S. 329</div></div></details>`}
function renderForms(){const root=$('forms');const mainSections=SECTIONS.filter(s=>s.key!=='narrative'&&s.key!=='complianceSummary'),narrativeSections=SECTIONS.filter(s=>s.key==='narrative');const compSec=SECTIONS.find(s=>s.key==='complianceSummary');root.innerHTML=guideVesselSizingHtml()+mainSections.map(sectionShellHtml).join('')+Object.entries(REGISTERS).map(([k,r])=>registerHtml(k,r)).join('')+sectionShellHtml(compSec)+`<details class="section" id="formsPhotoAppendixPanel"><summary>17. Photo Appendix</summary><div class="body"><div class="hint"><b>Photos are automatically aggregated from individual sections and displayed in the generated report.</b></div><div id="formsPhotoAppendix"></div></div></details>`+`<details class="section" id="formsDeclarationsPanel"><summary>18. Design Declarations</summary><div class="body"><div class="hint"><b>Signatures and design roles list. This mirrors the report sign-off table.</b></div><div id="formsDeclarations"></div></div></details>`+narrativeSections.map(sectionShellHtml).join('')+`<details class="section"><summary>20. Auto MTO Output</summary><div class="body"><div id="autoMto"></div><div class='chart-wrap' style='margin:8px 0'><div class='chart-title'><svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='10'/><path d='M12 2a10 10 0 010 20'/><path d='M12 12L2 12'/></svg> MTO Distribution</div><div id='chart-mto'></div></div></div></details>`;document.querySelectorAll('#forms input,#forms select,#forms textarea').forEach(el=>{el.addEventListener('input',()=>{RoleControl.onInput(el);if(['peakDemand','demandUnit','futureGrowth'].includes(el.id))StorageSel.syncFromBasis(false);if(el.id.includes('Model')&&!el.id.includes('Custom'))updatePrsRegulatorFields(true);App.refresh()});el.addEventListener('change',()=>{RoleControl.onInput(el);if(['peakDemand','demandUnit','futureGrowth','stUseBasis'].includes(el.id))StorageSel.syncFromBasis(false);if(el.id.includes('Model')&&!el.id.includes('Custom'))updatePrsRegulatorFields(true);App.refresh()})});if($('date')&&!v('date'))$('date').valueAsDate=new Date();StorageSel.syncFromBasis(false);Registers.init();Pipe.render();Mains.render();Services.render();Revisions.render();renderHydStages();Photo.renderAll();Guide.apply();updatePrsRegulatorFields(false);updatePrsSetpointHints();if(typeof DiversityCalc!=='undefined'){DiversityCalc.syncTabUI();DiversityCalc.renderMixed();DiversityCalc.updateDescSingle();}}
const DiversityCalc={
  types:[
    {id:'pre1977_wet',label:{en:'Wet CH — pre-1977',uk:'Водяне ЦО — до 1977'},desc:{en:'Older housing stock up to 1977 with wet central heating; higher heat loss and temperature-sensitive peak.',uk:'Старіший житловий фонд до 1977 року з водяним центральним опаленням; вищі втрати тепла та пік, чутливий до температури.'}},
    {id:'post1976_wet',label:{en:'Wet CH — post-1976',uk:'Водяне ЦО — після 1976'},desc:{en:'Post-1976 housing with improved insulation; typical wet central heating profile.',uk:'Житло після 1976 року з покращеною ізоляцією; типовий профіль водяного центрального опалення.'}},
    {id:'older_noch',label:{en:'No CH — older',uk:'Без ЦО — старіші будинки'},desc:{en:'Older homes without wet central heating; gas mainly for cooking/DHW; less temperature-sensitive profile.',uk:'Старіші будинки без водяного центрального опалення; газ в основному для приготування їжі/ГВП.'}},
    {id:'new_noch',label:{en:'No CH — new',uk:'Без ЦО — нові будинки'},desc:{en:'New homes without wet central heating; low base gas usage (cooking/DHW).',uk:'Нові будинки без водяного центрального опалення; низьке базове споживання газу.'}},
    {id:'post1990_ch',label:{en:'Post-1990 with CH',uk:'Після 1990 з ЦО'},desc:{en:'Post-1990 homes with wet central heating; better insulation and lower per-dwelling peak.',uk:'Будинки після 1990 року з водяним центральним опаленням; краща ізоляція та нижчий пік на одне житло.'}}
  ],
  paramsFor(type,A){const AA=Number(A)||0;switch(type){

const Revisions={
  cols:['Rev','Date','Description of Changes','File / Drawing No.','Prepared By','Checked By','Approved By'],
  keys:['rev','date','desc','ref','preparedBy','checkedBy','approvedBy'],
  render(){
    const wrap=$('revisionsWrap');
    if(!wrap)return;
    wrap.innerHTML=`<table class="data-table compact">
      <tr>${this.cols.map(c=>`<th>${I18N.t(c)}</th>`).join('')}<th>Action</th></tr>
      ${revisions.map((r,i)=>`<tr>
        <td><input style="width:45px" value="${esc(r.rev||'')}" onchange="Revisions.set(${i},'rev',this.value)"></td>
        <td><input type="date" value="${esc(r.date||'')}" onchange="Revisions.set(${i},'date',this.value)"></td>
        <td><textarea onchange="Revisions.set(${i},'desc',this.value)">${esc(r.desc||'')}</textarea></td>
        <td><input value="${esc(r.ref||'')}" onchange="Revisions.set(${i},'ref',this.value)"></td>
        <td><input value="${esc(r.preparedBy||'')}" onchange="Revisions.set(${i},'preparedBy',this.value)"></td>
        <td><input value="${esc(r.checkedBy||'')}" onchange="Revisions.set(${i},'checkedBy',this.value)"></td>
        <td><input value="${esc(r.approvedBy||'')}" onchange="Revisions.set(${i},'approvedBy',this.value)"></td>
        <td><button type="button" class="danger" onclick="Revisions.del(${i})">X</button></td>
      </tr>`).join('')}
    </table>`;
  },
  set(i,k,val){
    revisions[i][k]=val;
    App.refresh();
  },
  addRow(){
    revisions.push({
      rev:String(revisions.length+1),
      date:new Date().toISOString().slice(0,10),
      desc:'',
      ref:'',
      preparedBy:v('designer')||'',
      checkedBy:v('checker')||'',
      approvedBy:v('approver')||''
    });
    this.render();
    App.refresh();
  },
  del(i){
    if(revisions.length<=1){
      alert('At least one revision row is required.');
      return;
    }
    revisions.splice(i,1);
    this.render();
    App.refresh();
  }
};

  if(!wrap)return;
  let h='';
  for(let i=1;i<=count;i++){
    const nameId=`hydStage${i}_Name`;
    const inletId=`hydStage${i}_Inlet`;
    const minOutId=`hydStage${i}_MinOutlet`;
    const maxVelId=`hydStage${i}_MaxVel`;
    const maxDropId=`hydStage${i}_MaxDrop`;
    
    const nameVal=v(nameId)||`Stage ${i}`;
    const inletVal=v(inletId)||'';

    const maxDropVal=v(maxDropId)||'';

function hydraulicStagesReportTable(){
  const count=parseInt(v('hydStagesCount')||'1');
  const termReq=Calc.num(v('terminalPressureRequired'));
  const rows=[];
  for(let i=1;i<=count;i++){
    const name=v(`hydStage${i}_Name`)||`Stage ${i}`;
    const inlet=v(`hydStage${i}_Inlet`)||'-';
    const minOut=v(`hydStage${i}_MinOutlet`)||'-';
    const maxVel=v(`hydStage${i}_MaxVel`)||'-';
    const maxDrop=v(`hydStage${i}_MaxDrop`)||'-';
    
    const minOutNum=Calc.num(minOut);
    let status='REVIEW REQUIRED';
    if(minOut!=='-' && minOut!==''){
      status=minOutNum>=termReq?'PASS':'FAIL';
    }
    rows.push([
      name,

function mtoCategorizedReportHtml(mto){
  const categories={
    'VALVES':[],
    'PIPEWORK':[],
    'FITTINGS':[],
    'METERS / REGULATORS':[],
    'SAFETY & PROTECTION':[],
    'UNASSIGNED / MISC':[]
  };
  mto.forEach(row=>{
    const item=String(row[4]||'');
    const desc=String(row[5]||'');
    const catVal=String(row[9]||'').toUpperCase().trim();
    let targetCat='UNASSIGNED / MISC';
    if(catVal.includes('VALVE')){
      targetCat='VALVES';
    }else if(catVal.includes('PIPE')||catVal.includes('MAINS')||catVal.includes('SERVICE')||catVal.includes('TUBING')){
      targetCat='PIPEWORK';
    }else if(catVal.includes('FITTING')||catVal.includes('JOINT')||catVal.includes('FLANGE')){
      targetCat='FITTINGS';
    }else if(catVal.includes('METER')||catVal.includes('REGULATOR')||catVal.includes('PRS')||catVal.includes('PRI')){
      targetCat='METERS / REGULATORS';
    }else if(catVal.includes('SAFETY')||catVal.includes('PROTECTION')||catVal.includes('SIGN')||catVal.includes('BOLLARD')||catVal.includes('SLEEVE')){
      targetCat='SAFETY & PROTECTION';
    }else{
      const combined=(item+' '+desc).toLowerCase();
      if(combined.includes('valve')||combined.includes('ball valve')||combined.includes('non-return')||combined.includes('hose')||combined.includes('flexible')){
        targetCat='VALVES';
      }else if(combined.includes('pipe')||combined.includes('pe pipe')||combined.includes('steel pipe')||combined.includes('sdr11')){
        targetCat='PIPEWORK';
      }else if(combined.includes('fitting')||combined.includes('flange')||combined.includes('pecat')||combined.includes('bend')||combined.includes('coupler')||combined.includes('tee')){
        targetCat='FITTINGS';
      }else if(combined.includes('meter')||combined.includes('regulator')||combined.includes('clesse')||combined.includes('jeavons')||combined.includes('fiorentini')){
        targetCat='METERS / REGULATORS';
      }else if(combined.includes('sign')||combined.includes('signage')||combined.includes('atex')||combined.includes('sleeve')||combined.includes('bollard')){
        targetCat='SAFETY & PROTECTION';
      }
    }
    categories[targetCat].push(row);
  });
  let html='';
  const cols=REGISTERS.mto.cols;
  const categoriesOrder=['VALVES','PIPEWORK','FITTINGS','METERS / REGULATORS','SAFETY & PROTECTION','UNASSIGNED / MISC'];
  categoriesOrder.forEach(catName=>{
    const catRows=categories[catName];
    if(catRows.length>0){
      html+=`<h3>${I18N.t(catName)}</h3>${tableFromRows(cols,catRows)}`;
    }
  });
  return html;
}

  /* ── Chart 1: Vapourisation Curve ── */
  vapChart(){
    const wrap=$('chart-vap');if(!wrap)return;
    const W=wrap.clientWidth||340,H=160,ml=48,mr=12,mt=14,mb=36;
    const pw=W-ml-mr,ph=H-mt-mb;
    const svg=this.el('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart-svg'});
    // Data: natural off-take vs ambient temp
    // Simplified Calor propane vaporisation formula
    // Off-take ≈ capacity_ke * (T+16)/31 * fill_factor kW (normalised curve)
    const peakKW=StorageSel.peakKW()||100;
    const vesselKg=n('stSelCapacity')||500;
    const count=Math.max(1,n('stSelCount')||1);
    const fillFrac=n('stFill')||0.85;
    const heelFrac=n('stHeel')||0.10;
    
    const sel=StorageSel.selected();
    const hasRow=!!sel.row;
    const baseKW=hasRow?sel.avKW:(vesselKg*count*0.009*13.9*((fillFrac-heelFrac)/100));
    
    const temps=[-15,-10,-5,0,5,10,15];
    const offTake=temps.map(t=>{
      if(hasRow){
        // Calibrate curve so +5C matches the certified table value (sel.avKW)
        const factor=Math.max(0,(t+16)/21);
        return baseKW*factor;
      }else{
        // Fallback to corrected generic formula
        const factor=Math.max(0,(t+16)/31);
        return baseKW*factor;
      }
    });
    const maxOT=Math.max(...offTake,peakKW)*1.15;
    const scaleX=i=>(ml+pw*i/(temps.length-1));
    const scaleY=v=>(mt+ph-(ph*Math.min(v,maxOT)/maxOT));
    // Grid
    [0,.25,.5,.75,1].forEach(f=>{
      const y=mt+ph-ph*f;
      svg.appendChild(this.line(ml,y,ml+pw,y,'chart-grid'));
      svg.appendChild(this.text(ml-4,y+3,(maxOT*f).toFixed(0),'end','chart-label'));
    });
    temps.forEach((t,i)=>{
      const x=scaleX(i);
      svg.appendChild(this.line(x,mt+ph,x,mt+ph+3,'chart-axis'));
      svg.appendChild(this.text(x,mt+ph+13,t+'°','middle','chart-label'));
    });
    // Area under vap curve
    const pts=temps.map((t,i)=>`${scaleX(i)},${scaleY(offTake[i])}`);
    const area=this.el('polygon',{
      points:`${ml},${mt+ph} `+pts.join(' ')+` ${ml+pw},${mt+ph}`,
      class:'chart-area-vap'
    });
    svg.appendChild(area);
    // Vap line
    const path=this.el('polyline',{points:pts.join(' '),class:'chart-line-vap'});
    svg.appendChild(path);
    // Peak demand line
    if(peakKW>0&&peakKW<maxOT){
      const py=scaleY(peakKW);
      svg.appendChild(this.el('line',{x1:ml,y1:py,x2:ml+pw,y2:py,class:'chart-line-demand'}));
      svg.appendChild(this.text(ml+pw-2,py-3,'Peak '+peakKW.toFixed(0)+' kW','end','chart-value'));
    }
    // Axes
    svg.appendChild(this.line(ml,mt,ml,mt+ph,'chart-axis'));
    svg.appendChild(this.line(ml,mt+ph,ml+pw,mt+ph,'chart-axis'));
    svg.appendChild(this.text(ml-36,mt+ph/2,'kW','middle','chart-label'));
    svg.appendChild(this.text(ml+pw/2,H-2,'Ambient Temperature (°C)','middle','chart-label'));
    wrap.innerHTML='';wrap.appendChild(svg);
  },

  mtoChart(){

    svg.appendChild(this.text(cx,cy+10,'items','middle','chart-label'));
    wrap.innerHTML='';wrap.appendChild(svg);
  },
